<div class="flex items-baseline justify-between mb-1">
  <h1 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Memory</h1>
  <span class="text-xs text-gray-400 font-mono">{{.Path}}</span>
</div>
<div class="lede">
  <p>Your global <span class="code">CLAUDE.md</span>, with live preview. Each save keeps a backup — manage them in <a href="/audit" class="text-blue-600 dark:text-blue-400 hover:underline">Logs</a>.</p>
</div>

{{if .LoadError}}
<div class="rounded bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300 px-4 py-3 text-sm">Couldn't read CLAUDE.md: {{.LoadError}}</div>
{{else}}
<form id="memory-form">
  <div class="grid md:grid-cols-2 gap-4">
    <textarea id="md-editor" name="content" spellcheck="false"
              hx-post="/memory/render" hx-trigger="keyup changed delay:500ms" hx-target="#md-preview"
              class="w-full h-[70vh] resize-none overflow-auto rounded border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 px-3 py-2 font-mono text-[13px] leading-6 focus:outline-none focus:ring-2 focus:ring-blue-200">{{.Content}}</textarea>
    <div id="md-preview" class="prose prose-sm dark:prose-invert max-w-none h-[70vh] overflow-auto rounded border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-5 py-3">{{.Rendered}}</div>
  </div>
  <div class="pt-4">
    <button type="button" hx-post="/memory/preview" hx-include="#memory-form" hx-target="#modal" hx-swap="innerHTML"
            class="px-5 py-2 rounded bg-blue-600 text-white text-sm hover:bg-blue-700">Preview changes</button>
  </div>
</form>

<script>
  (function () {
    var ed = document.getElementById('md-editor'), pv = document.getElementById('md-preview');
    if (!ed || !pv) return;
    var lock = false;
    function sync(src, dst) {
      if (lock) { lock = false; return; }
      lock = true;
      var denom = (src.scrollHeight - src.clientHeight) || 1;
      dst.scrollTop = (src.scrollTop / denom) * (dst.scrollHeight - dst.clientHeight);
    }
    ed.addEventListener('scroll', function () { sync(ed, pv); });
    pv.addEventListener('scroll', function () { sync(pv, ed); });
  })();
</script>
{{end}}
