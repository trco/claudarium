<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-3xl max-h-[85vh] flex flex-col">
    <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
      <h2 class="font-semibold text-gray-900 dark:text-gray-100">Review changes</h2>
      <button onclick="document.getElementById('modal').innerHTML=''" class="text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">&times;</button>
    </div>
    {{if .Error}}
    <div class="p-4 text-red-700 text-sm">{{.Error}}</div>
    <div class="px-4 py-3 border-t border-gray-200 flex justify-end">
      <button onclick="document.getElementById('modal').innerHTML=''" class="px-4 py-2 text-sm rounded border border-gray-300">Close</button>
    </div>
    {{else}}
    <div class="overflow-auto p-4 font-mono text-xs leading-5 flex-1">
      {{if .HasChanges}}
        {{range .Diff}}
        <div class="whitespace-pre {{if eq .Op "+"}}diff-add{{else if eq .Op "-"}}diff-del{{end}}">{{.Op}} {{.Text}}</div>
        {{end}}
      {{else}}
        <div class="text-gray-500">No changes to save.</div>
      {{end}}
    </div>
    <div class="px-4 py-3 border-t border-gray-200 flex justify-end gap-2">
      <button onclick="document.getElementById('modal').innerHTML=''" class="px-4 py-2 text-sm rounded border border-gray-300">Cancel</button>
      {{if .HasChanges}}
      <button hx-post="{{.ApplyURL}}" hx-include="{{.Include}}" hx-swap="none"
              class="px-4 py-2 text-sm rounded bg-blue-600 text-white hover:bg-blue-700">Apply &amp; save</button>
      {{end}}
    </div>
    {{end}}
  </div>
</div>
