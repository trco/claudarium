<div class="grid gap-3 sm:grid-cols-3 mb-4">
  {{range .Windows}}
  <div class="rounded border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-4 py-3">
    <div class="text-[10.5px] uppercase tracking-wider text-gray-400">{{.Key}}</div>
    <div class="text-lg font-semibold text-gray-900 dark:text-gray-100 tabular-nums">{{.TokensFmt}} tokens</div>
    <div class="text-xs text-gray-500 dark:text-gray-400">{{.CostFmt}} · {{.Sessions}} sessions</div>
  </div>
  {{end}}
</div>
